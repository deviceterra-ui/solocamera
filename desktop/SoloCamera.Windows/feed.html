<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Solo Camera · clean feed</title><style>html,body{margin:0;background:#000;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain}</style></head><body><canvas width="1280" height="720"></canvas><script>
const base=location.pathname.slice(0,location.pathname.lastIndexOf('/')+1),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),slots=Array.from({length:4},()=>({image:null,at:0,rotation:0,sequence:'',queue:[],audioAfter:0,audioClock:null,audioAt:0}));let mode=-1;
async function receive(i){let s=slots[i];for(;;){try{if(mode!==-1&&mode!==i){await new Promise(r=>setTimeout(r,100));continue;}let r=await fetch(base+'frame/'+i+'?after='+encodeURIComponent(s.sequence||'-1'),{cache:'no-store'});if(r.status===200){const seq=r.headers.get('X-Sequence');if(seq!==s.sequence){let image=await createImageBitmap(await r.blob());if(s.image&&!s.queue.some(f=>f.image===s.image))s.image.close();s.image=image;let pts=Number(r.headers.get('X-Time-Us')||0);if(pts){s.queue.push({image,pts});while(s.queue.length>8){let old=s.queue.shift();if(old.image!==s.image)old.image.close();}}s.sequence=seq;s.rotation=Number(r.headers.get('X-Rotation')||0);s.at=performance.now();}}}catch{}await new Promise(r=>setTimeout(r,4));}}
async function status(){try{let s=await(await fetch(base+'status',{cache:'no-store'})).json();const fixed=new URLSearchParams(location.search).get('camera');mode=fixed===null?s.mode:Number(fixed);}catch{}setTimeout(status,200)}
const audioContext=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});let audioMode=-2;const activeSounds=new Set();
function resetAudio(){for(const source of activeSounds){try{source.stop();}catch{}}activeSounds.clear();for(const s of slots)s.audioClock=null;}
document.addEventListener('pointerdown',()=>audioContext.resume());
async function receiveAudio(i){const s=slots[i];for(;;){try{let selected=mode<0?0:mode;if(i!==selected){s.audioClock=null;await new Promise(r=>setTimeout(r,50));continue;}if(audioMode!==selected){resetAudio();audioMode=selected;}await audioContext.resume();let r=await fetch(base+'audio/'+i+'?after='+s.audioAfter,{cache:'no-store'});if(r.status===200){const data=await r.arrayBuffer(),view=new DataView(data);let p=0;while(p+24<=data.byteLength){const sequence=Number(view.getBigInt64(p)),pts=Number(view.getBigInt64(p+8)),rate=view.getInt32(p+16),size=view.getInt32(p+20);p+=24;if(rate!==48000||size<2||size>19200||size%2||p+size>data.byteLength)throw Error('Invalid audio');s.audioAfter=sequence;if(!s.audioClock)s.audioClock={pts,at:audioContext.currentTime+.12};let start=s.audioClock.at+(pts-s.audioClock.pts)/1e6;if(start<audioContext.currentTime-.08||start>audioContext.currentTime+.35){resetAudio();s.audioClock={pts,at:audioContext.currentTime+.12};start=s.audioClock.at;}const buffer=audioContext.createBuffer(1,size/2,rate),samples=buffer.getChannelData(0);for(let n=0;n<samples.length;n++)samples[n]=view.getInt16(p+n*2,true)/32768;p+=size;const source=audioContext.createBufferSource();source.buffer=buffer;source.connect(audioContext.destination);activeSounds.add(source);source.onended=()=>activeSounds.delete(source);source.start(Math.max(audioContext.currentTime,start));s.audioAt=performance.now();}}}catch{}await new Promise(r=>setTimeout(r,10));}}
function draw(){ctx.fillStyle='#000';ctx.fillRect(0,0,1280,720);for(let i=0;i<4;i++){if(mode!==-1&&mode!==i)continue;const s=slots[i];if(!s.image||performance.now()-s.at>2000)continue;let image=s.image;if(s.audioClock&&performance.now()-s.audioAt<1000&&s.queue.length){const target=s.audioClock.pts+(audioContext.currentTime-s.audioClock.at)*1e6;const ready=s.queue.filter(f=>f.pts<=target);if(ready.length)image=ready[ready.length-1].image;else image=s.queue[0].image;}const x=mode===-1?(i%2)*640:0,y=mode===-1?Math.floor(i/2)*360:0,w=mode===-1?640:1280,h=mode===-1?360:720;let rotated=s.rotation===90||s.rotation===270,iw=rotated?image.height:image.width,ih=rotated?image.width:image.height,scale=Math.min(w/iw,h/ih);ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate(s.rotation*Math.PI/180);ctx.drawImage(image,-image.width*scale/2,-image.height*scale/2,image.width*scale,image.height*scale);ctx.restore();}requestAnimationFrame(draw)}status();slots.forEach((_,i)=>{receive(i);receiveAudio(i);});draw();
</script></body></html>
